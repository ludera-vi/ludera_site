<form class="contact-form" id="contactForm" method="post" action="{% url 'main:contact_submit' %}">
    {% csrf_token %}
    <div class="contact-form__fields">
        <div class="contact-form__row">
            <input type="text" name="name" class="contact-form__input" placeholder="{{ settings.contact_name_placeholder }}" required>
            <input type="email" name="email" class="contact-form__input" placeholder="{{ settings.contact_email_placeholder }}" required>
        </div>
        <textarea name="message" class="contact-form__textarea" placeholder="{{ settings.contact_message_placeholder }}" rows="0"></textarea>
    </div>
    <button type="submit" class="btn btn--primary btn--large contact-form__submit">
        {{ settings.contact_submit_text }}
    </button>
    <div class="contact-form__success" id="contactSuccess" style="display:none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        <span>{{ settings.contact_success_text }}</span>
    </div>
</form>
